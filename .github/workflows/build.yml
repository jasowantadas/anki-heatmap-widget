name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleStandardRelease assembleOppoRelease --stacktrace
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/standard/release/app-standard-release.apk AnkiHeatmap.apk
          cp app/build/outputs/apk/oppo/release/app-oppo-release.apk AnkiHeatmap-Oppo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AnkiHeatmap
          path: AnkiHeatmap*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Anki Heatmap build ${{ github.run_number }}
          body: "AnkiHeatmap.apk: normal version (Xiaomi tablet). AnkiHeatmap-Oppo.apk: Oppo tablet version with a fixed widget size measured on that tablet."
          files: |
            AnkiHeatmap.apk
            AnkiHeatmap-Oppo.apk
          make_latest: true
