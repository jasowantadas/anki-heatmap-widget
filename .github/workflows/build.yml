name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AnkiHeatmap.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AnkiHeatmap
          path: AnkiHeatmap.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Anki Heatmap build ${{ github.run_number }}
          body: Download AnkiHeatmap.apk below and open it on your phone to install.
          files: AnkiHeatmap.apk
          make_latest: true
